services:
  # 1. Main B2B Outreach API, Dashboard & Webhook Server
  - type: web
    name: b2b-outreach-engine
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore # Closest low-latency region to Delhi NCR (or oregon/frankfurt)
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SYSTEM_ENVIRONMENT
        value: production
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: WHATSAPP_VERIFY_TOKEN
        value: NCR_WHATSAPP_VERIFY_TOKEN_2026
      - key: EMAIL_DAILY_PILOT_LIMIT
        value: "25"
      - key: WHATSAPP_DAILY_PILOT_LIMIT
        value: "20"
      # Database connection auto-linked from PostgreSQL service below
      - key: DATABASE_URL
        fromDatabase:
          name: b2b-postgres-db
          property: connectionString
      # Secrets to be entered by user in Render dashboard
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

databases:
  # 2. Managed PostgreSQL Database on Render
  - name: b2b-postgres-db
    databaseName: b2b_outreach
    user: b2b_admin
    plan: free
    region: singapore
